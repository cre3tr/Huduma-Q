version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      safe-updates:
        update-types: ["patch", "minor"]
    ignore:
      # Blocked upstream: eslint-plugin-react@7.37.5 (latest) peers eslint <= ^9.7.
      # Remove once a release admits ^10. See DEPENDENCIES.md DEP-4.
      - dependency-name: "eslint"
        versions: [">=10.0.0"]
    commit-message:
      prefix: "chore(deps)"
